name: South Africa CPI bridge

on:
  workflow_dispatch:
  schedule:
    - cron: '20 17 * * *'

permissions:
  contents: write

concurrency:
  group: south-africa-cpi-bridge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install reader
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Fetch and validate official Stats SA CPI
        run: python scripts/fetch_south_africa_cpi.py

      - name: Commit newer observation
        shell: bash
        run: |
          git add data/south-africa-cpi.json
          if git diff --cached --quiet; then
            echo 'No CPI data change.'
            exit 0
          fi
          git config user.name 'capitalrisk-snapshot-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update South Africa CPI bridge'
          git push
